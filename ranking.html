<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INOVA Paraíso 2026 - Ranking do Hackathon</title>
  <link rel="stylesheet" href="index.css">
</head>
<body class="evaluation-page ranking-page">
  <div class="container">
    <header class="evaluation-header">
      <div class="event-brand">
        <img class="event-logo" src="Logos/Logo.png" alt="" aria-hidden="true">
        <div class="event-heading">
          <p class="evaluation-kicker">UFLA <span>·</span> Câmpus São Sebastião do Paraíso</p>
          <h1>INOVA Paraíso 2026</h1>
          <p>Ranking das propostas · Hackathon</p>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html">Voltar para Avaliação</a>
      </div>
    </header>

    <div class="card" id="rankingContent" hidden>
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Startup</th>
            <th>Avaliações</th>
            <th>Pontuação Total</th>
            <th>Observações</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando resultados...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <dialog id="observationDialog" class="observation-dialog" aria-labelledby="observationTitle">
    <div class="observation-dialog-header">
      <h2 id="observationTitle">Observações</h2>
      <button type="button" class="dialog-close" id="closeObservationDialog" aria-label="Fechar">&times;</button>
    </div>
    <div id="observationContent" class="observation-content"></div>
  </dialog>

  <dialog id="loginDialog" class="login-dialog" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-form">
      <p class="login-kicker">Área restrita</p>
      <h2 id="loginTitle">Acesse o ranking</h2>
      <p class="login-description">Digite o login e a senha para visualizar os resultados.</p>
      <div class="form-group">
        <label for="loginUsername">Login</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <button type="submit" class="btn-primary" id="loginButton">Entrar</button>
    </form>
  </dialog>

  <script type="module" src="ranking.js"></script>
</body>
</html>
